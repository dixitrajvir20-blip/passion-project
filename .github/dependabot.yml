version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before adopting a new release: most malicious versions are pulled within days.
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testing:
        patterns: ['vitest', '@playwright/*', '@axe-core/*']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
